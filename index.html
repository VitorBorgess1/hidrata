<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>Hidrata</title>
<style>
  :root { --bg:#071a3a; --card:#0f2a5c; --agua:#4fc3f7; --txt:#e8f1ff; --sub:#8fa8d1; --alerta:#ffb74d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--txt);
         padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); min-height:100vh; }
  h1 { font-size:20px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  button { font:inherit; border:0; border-radius:14px; cursor:pointer; color:var(--txt); }
  .icone { background:var(--card); width:40px; height:40px; font-size:18px; }
  .copo { position:relative; width:180px; height:240px; margin:8px auto 20px; border:3px solid var(--agua);
          border-radius:12px 12px 40px 40px; overflow:hidden; }
  .nivel { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(#4fc3f7cc,#0288d1); transition:height .6s ease; }
  .copo span { position:absolute; inset:0; display:grid; place-items:center; font-size:30px; font-weight:700; text-shadow:0 2px 6px #0008; }
  .resumo { text-align:center; color:var(--sub); margin-bottom:6px; }
  .status { text-align:center; padding:10px; border-radius:12px; margin-bottom:16px; font-size:14px; background:var(--card); }
  .status.atras { background:#5a3a0a; color:var(--alerta); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  .grid button { background:var(--card); padding:16px 0; font-size:16px; font-weight:600; }
  .grid button:active { transform:scale(.96); }
  .linha { display:flex; gap:10px; margin-bottom:16px; }
  .linha input { flex:1; }
  input { font:inherit; background:var(--card); color:var(--txt); border:1px solid #2a4a85; border-radius:12px; padding:12px; width:100%; }
  .primario { background:#0288d1; padding:12px 16px; font-weight:600; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid #1d3a70; color:var(--sub); }
  li button { background:none; color:#ef9a9a; }
  dialog { background:var(--card); color:var(--txt); border:0; border-radius:18px; width:min(92vw,400px); }
  dialog::backdrop { background:#000a; }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 0 4px; }
</style>
</head>
<body>
  <h1>💧 Hidrata <span><button class="icone" id="btnNotif" title="Notificações">🔔</button> <button class="icone" id="btnCfg" title="Configurações">⚙️</button></span></h1>

  <div class="copo"><div class="nivel" id="nivel"></div><span id="pct">0%</span></div>
  <div class="resumo" id="resumo">0 / 2000 ml</div>
  <div class="status" id="status">—</div>

  <div class="grid">
    <button data-ml="150">+150</button><button data-ml="250">+250</button><button data-ml="350">+350</button>
    <button data-ml="500">+500</button><button data-ml="750">+750</button><button data-ml="1000">+1 L</button>
  </div>
  <div class="linha"><input id="custom" type="number" inputmode="numeric" placeholder="Outro valor (ml)"><button class="primario" id="btnAdd">Adicionar</button></div>

  <h3 style="font-size:15px;color:var(--sub)">Hoje</h3>
  <ul id="historico"></ul>

  <dialog id="cfg">
    <form method="dialog">
      <h3 style="margin-top:0">Configurações</h3>
      <label>Meta diária (ml)</label><input id="cMeta" type="number" inputmode="numeric">
      <label>Acordo às (hora)</label><input id="cInicio" type="number" min="0" max="23">
      <label>Durmo às (hora)</label><input id="cFim" type="number" min="1" max="24">
      <label>Avisar quando estiver atrás em (% da meta)</label><input id="cTol" type="number" min="5" max="80">
      <label>Intervalo mínimo entre lembretes (min)</label><input id="cInt" type="number" min="15">
      <div class="linha" style="margin-top:18px"><button value="cancel" class="icone" style="flex:1">Cancelar</button><button class="primario" id="btnSalvar" value="ok" style="flex:1">Salvar</button></div>
    </form>
  </dialog>

<script src="/app.js"></script>
</body>
</html>
